name = "stablemanager"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "stablemanager-staging"
database_id = "57fa650d-b427-4387-a468-0a688634b1ef"
migrations_dir = "migrations"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]


[triggers]
crons = ["0 6 * * *"]

[vars]
APP_NAME = "Stablemanager"
ENVIRONMENT = "development"

# Set via: wrangler secret put SESSION_SECRET
# Optional: wrangler secret put RESEND_API_KEY
